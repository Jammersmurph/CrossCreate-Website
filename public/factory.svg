  <g fill="#bfc7bb">
    <path d="m425 109-18-10V79l20-12 20 12v20z" opacity=".18" filter="url(#soft)"/>
    <path d="m449 76-25-14V37l25-14 25 14v25z" opacity=".13" filter="url(#soft)"/>
    <path d="m477 39-22-13V4l22-13 22 13v22z" opacity=".08" filter="url(#soft)"/>
  </g>

  <!-- main factory -->
  <path d="m250 308 117-68 144 83-117 68z" fill="url(#steelL)"/>
  <path d="M250 308v113l144 83V391z" fill="#3b4642"/>
  <path d="m394 391 117-68v113l-117 68z" fill="#2c3633"/>
  <path d="M250 308v113l144 83V391zm144 83 117-68v113l-117 68z" fill="url(#brick)" opacity=".35"/>
  <path d="m250 409 144 83 117-68v15l-117 68-144-83z" fill="#1c2422"/>
  <path d="m262 329 7 4v86l-7-4zm108 62 8 4v87l-8-5z" fill="#2b3431"/>

  <!-- window light -->
  <ellipse cx="295" cy="380" rx="62" ry="58" fill="url(#lampGlow)" opacity=".5"/>
  <ellipse cx="342" cy="407" rx="60" ry="56" fill="url(#lampGlow)" opacity=".45"/>
  <use href="#window" transform="translate(282 353)"/>
  <use href="#window" transform="translate(329 380)"/>

  <!-- door and vents -->
  <path d="m420 416 31-18v72l-31 18z" fill="#3c2f21" stroke="#5e513c" stroke-width="5"/>
  <path d="m435 408 1 71" stroke="#79684b" stroke-width="3"/>
  <circle cx="442" cy="450" r="2" fill="#e4c188"/>
  <path d="m432 424 12-7v16l-12 7z" fill="#3a2c1d" stroke="#6d5a3f" stroke-width="1.5"/>
  <path d="m470 387 23-13v35l-23 13z" fill="#1e2b27" stroke="#7e6f4f" stroke-width="4"/>
  <path d="m481 381v35m-11-12 23-13" stroke="#7e6f4f" stroke-width="3"/>

  <!-- copper roof -->
  <path d="m232 303 65-113 146 84-66 113z" fill="url(#copperL)"/>
  <path d="m297 190 146 84 86 43-86-105z" fill="url(#copperR)"/>
  <path d="m232 303 145 84 152-70-86-105-146-22z" stroke="#513523" stroke-width="5" stroke-linejoin="round"/>
  <path d="m247 300 57-97m-29 116 57-97m-29 116 57-97m-29 116 57-97" stroke="#6f4227" stroke-width="3" opacity=".55"/>
  <path d="m232 303 145 84 152-70v10l-152 70-145-84z" fill="#2a2119"/>
  <path d="m283 288 60-35 62 36-60 35z" fill="#d9a65a" opacity=".06"/>

  <!-- roof dormer -->
  <path d="m315 280 25-40 35 20 5 50-33 19-32-18z" fill="#4b554f"/>
  <path d="m315 280 25-40 35 20-25 40z" fill="#3f5f4f"/>
  <path d="m350 300 25-40 16 38-11 12z" fill="#54735d"/>
  <ellipse cx="338" cy="320" rx="34" ry="32" fill="url(#lampGlow)" opacity=".5"/>
  <path d="m329 293 19 11v22l-19-11z" fill="#ffcf82" stroke="#c9a464" stroke-width="3"/>

  <!-- workshop extension -->
  <path d="m173 334 58-34 63 37v89l-58 34-63-37z" fill="#46504a"/>
  <path d="m236 371 58-34v89l-58 34z" fill="#333c37"/>
  <path d="m161 331 71-41 74 43-71 41z" fill="#4b6b57" stroke="#2f463a" stroke-width="4"/>
  <path d="m161 331 74 43v10l-74-43z" fill="#2c4137"/>
  <path d="m235 374 71-41v10l-71 41z" fill="#37503f"/>
  <path d="m179 332 55-32m-36 43 55-32m-36 43 55-32m-36 43 55-32" stroke="#6d8a74" stroke-width="2" opacity=".4"/>
  <ellipse cx="198" cy="382" rx="42" ry="38" fill="url(#lampGlow)" opacity=".4"/>
  <use href="#window" transform="translate(187 363) scale(.83)"/>

  <!-- brass drive wheel -->
  <g transform="translate(262 398) skewY(-30) scale(.62 .7)">
    <use href="#gear"/>
  </g>
  <path d="m262 398 37 21" stroke="#2f2b20" stroke-width="8"/>
  <path d="m262 394 37 21" stroke="#a99a6f" stroke-width="3"/>

  <!-- water channel and wheel -->
  <path d="m486 452 50-29 57 33-50 29z" fill="#2b4f4b"/>
  <path d="m498 453 32-18 43 25-32 18z" fill="#3e6a60"/>
  <path d="m515 446 35 20m-24-27 35 20" stroke="#7fa89a" stroke-width="2" opacity=".7"/>
  <g transform="translate(506 392) skewY(-30) scale(.88 1)">
    <circle r="43" fill="#33402f" stroke="#5d4a30" stroke-width="9"/>
    <circle r="32" stroke="#c99b55" stroke-width="9"/>
    <path d="M-33 0h66M0-33v66m-24-57 48 48m-48 0 48-48" stroke="#c99b55" stroke-width="7"/>
    <circle r="9" fill="#efcf96" stroke="#4b3a22" stroke-width="4"/>
    <path d="M-43-8v16m86-16v16M-8-43H8M-8 43H8" stroke="#b98f52" stroke-width="10"/>
  </g>

  <!-- rails -->
  <path d="m160 425 214 124 208-121" stroke="#55543f" stroke-width="35"/>
  <path d="m164 421 27-16m-9 26 27-16m-9 26 27-16m-9 26 27-16m-9 26 27-16m-9 26 27-16m-9 26 27-16m-9 26 27-16m-9 26 27-16m-9 26 27-16m-9 26 27-16m-9 26 27-16m6 16-26-16m44 6-26-16m44 6-26-16m44 6-26-16m44 6-26-16m44 6-26-16m44 6-26-16m44 6-26-16m44 6-26-16m44 6-26-16" stroke="#35342a" stroke-width="6"/>
  <path d="m155 418 219 126 212-123m-239 120 27 16 219-127" stroke="#7d8272" stroke-width="3"/>
  <path d="m150 433 197 114" stroke="#33372f" stroke-width="4"/>

  <!-- locomotive -->
  <g transform="translate(350 465)">
    <path d="m-21 15 46-27 50 29-46 27z" fill="#2c3a31"/>
    <path d="m-21 15 50 29v12l-50-29z" fill="#232c26"/>
    <path d="m29 44 46-27v12L29 56z" fill="#1c2721"/>
    <path d="m-11 8 29-17 36 21-29 17z" fill="#4d5f50"/>
    <path d="M-11 8v17l36 21V29z" fill="#33473a"/>
    <path d="m25 29 29-17v17L25 46z" fill="#26382e"/>
    <path d="m24-23 22-13 23 13v32L47 22 24 9z" fill="#33473a"/>
    <path d="m24-23 23 13v32L24 9z" fill="#53654f"/>
    <path d="m30-17 10 6V3L30-3z" fill="#ffcf82"/>
    <path d="m47-10 15-9V-4L47 5z" fill="#d9c69a"/>
    <path d="m17-26 30-17 30 17-30 18z" fill="#26382e"/>
    <path d="m-3-5 10-6 11 6v18L7 19-3 13z" fill="#2a3830"/>
    <path d="m-7-8 14-8 15 8-15 9z" fill="#7d775c"/>
    <ellipse cx="-4" cy="29" rx="7" ry="10" transform="rotate(-30 -4 29)" fill="#242a22" stroke="#8c7a52" stroke-width="3"/>
    <ellipse cx="19" cy="43" rx="7" ry="10" transform="rotate(-30 19 43)" fill="#242a22" stroke="#8c7a52" stroke-width="3"/>
    <circle cx="-14" cy="6" r="15" fill="url(#lampGlow)"/>
    <path d="m-14 6-38-16v32z" fill="#ffcf82" opacity=".12" filter="url(#softSmall)"/>
  </g>

  <!-- windmill -->
  <path d="m176 282 31-18 29 17 8 98-36 21-40-23z" fill="#555f57"/>
  <path d="m207 299 29-18 8 98-36 21z" fill="#3c4640"/>
