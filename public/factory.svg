<svg xmlns="http://www.w3.org/2000/svg" width="740" height="700" viewBox="0 0 740 700" fill="none">
  <title>The CrossCreate workshop at night</title>
  <desc>An original isometric illustration of a night-time factory: a copper-roofed workshop with glowing windows, brass gears, a windmill, a water wheel and a railway, floating on an island of dark stone and grass.</desc>

  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9a65a" stop-opacity=".16"/>
      <stop offset=".6" stop-color="#d9a65a" stop-opacity=".05"/>
      <stop offset="1" stop-color="#d9a65a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcf82" stop-opacity=".65"/>
      <stop offset=".55" stop-color="#ffb85c" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffb85c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="copperL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b06a45"/>
      <stop offset="1" stop-color="#8d4f31"/>
    </linearGradient>
    <linearGradient id="copperR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cd8753"/>
      <stop offset="1" stop-color="#a25f38"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f5a53"/>
      <stop offset="1" stop-color="#3a4540"/>
    </linearGradient>
    <pattern id="brick" width="44" height="30" patternUnits="userSpaceOnUse">
      <path d="M0 0h44M0 30h44" stroke="#101614" stroke-opacity=".55" stroke-width="2"/>
      <path d="M22 0v30" stroke="#101614" stroke-opacity=".32" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softSmall" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <g id="window">
      <path d="M0 0 27 15V51L0 36Z" fill="#ffcf82" stroke="#c9a464" stroke-width="4"/>
      <path d="m13 8 1 36M0 18l27 15" stroke="#a8813f" stroke-width="3"/>
      <path d="m3 6 8 4v12l-8-4z" fill="#ffe6ae" opacity=".55"/>
    </g>

    <g id="gear">
      <path d="m-8-46 16 0 3 11 10 4 10-6 11 11-6 10 4 10 11 3v16l-11 3-4 10 6 10-11 11-10-6-10 4-3 11h-16l-3-11-10-4-10 6-11-11 6-10-4-10-11-3v-16l11-3 4-10-6-10 11-11 10 6 10-4z" fill="#c99b55" stroke="#4b3a22" stroke-width="3"/>
      <circle r="27" fill="#4c4531" stroke="#4b3a22" stroke-width="4"/>
      <path d="M-23 0H23M0-23V23m-17-17 34 34m-34 0 34-34" stroke="#d8ae68" stroke-width="7"/>
      <circle r="9" fill="#efcf96" stroke="#4b3a22" stroke-width="3"/>
    </g>

    <g id="tree">
      <path d="M-5 0v51l13-7V0" fill="#3f2f22"/>
      <path d="m0-85 36 20v43L0-2l-35-20v-43z" fill="#2c4433"/>
      <path d="m0-85 36 20L0-44l-35-21z" fill="#49654a"/>
      <path d="M0-44v42l36-20v-43z" fill="#35513c"/>
      <path d="m-13-106 29 16v30l-29 16-29-16v-30z" fill="#3a5740"/>
      <path d="m-13-106 29 16-29 17-29-17z" fill="#5a7750"/>
    </g>

    <g id="crate">
      <path d="m0 0 28-16 28 16-28 16z" fill="#7d603d"/>
      <path d="M0 0v32l28 16V16z" fill="#523d25"/>
      <path d="m28 16 28-16v32L28 48z" fill="#654b2c"/>
      <path d="m5 6 18 10v24L5 30zm28 10 18-10v24L33 40z" stroke="#3a2c1b" stroke-width="2"/>
      <path d="m5 6 18 34m10 0L51 6" stroke="#3a2c1b" stroke-width="2"/>
    </g>
  </defs>

  <!-- ambient light -->
  <ellipse cx="372" cy="330" rx="330" ry="270" fill="url(#halo)"/>
  <g opacity=".1" stroke="#d9a65a" stroke-width="1.4" fill="none" transform="translate(618 96) scale(3.1)">
    <path d="M10.6 1h2.8l.6 2.7 1.4.6 2.2-1.5 2 2-1.5 2.2.6 1.4 2.7.6v2.8l-2.7.6-.6 1.4 1.5 2.2-2 2-2.2-1.5-1.4.6-.6 2.7h-2.8l-.6-2.7-1.4-.6-2.2 1.5-2-2 1.5-2.2-.6-1.4L1 13.4v-2.8l2.7-.6.6-1.4-1.5-2.2 2-2 2.2 1.5 1.4-.6z"/>
    <circle cx="12" cy="12" r="4.4"/>
  </g>
  <g fill="#d9a65a" opacity=".35">
    <circle cx="82" cy="128" r="1.4"/><circle cx="148" cy="86" r="1"/><circle cx="634" cy="238" r="1.2"/>
    <circle cx="690" cy="176" r="1"/><circle cx="60" cy="252" r="1"/><circle cx="556" cy="64" r="1.3"/>
  </g>

  <!-- survey lines -->
  <ellipse cx="380" cy="584" rx="248" ry="54" fill="#0a0c0d" opacity=".5"/>
  <path d="m57 420 314-181 314 181-314 182z" stroke="#6f7a63" stroke-opacity=".35" stroke-dasharray="4 7"/>
  <path d="M371 215v32M42 420h30M671 420h30M371 590v30" stroke="#6f7a63" stroke-opacity=".5"/>

  <!-- floating island -->
  <path d="m99 398 261-151 278 160-262 152z" fill="#4c5a40"/>
  <path d="M99 398v53l61 35v31l69 40v25l79 45 68-39v-29z" fill="#3a342b"/>
  <path d="m376 559 262-152v48l-45 26v29l-78 45v29l-80 46-59-42z" fill="#2a2f27"/>
  <path d="m99 398 277 161v18L99 417z" fill="#3e4c37"/>
  <path d="m376 559 262-152v18L376 577z" fill="#313b2e"/>
  <path d="m118 430 30 17v19l-30-17zm50 29 41 24v19l-41-24zm68 43 35 20v25l-35-20zm68 46 37 21v27l-37-22z" fill="#4a4336"/>
  <path d="m423 553 39-23v18l-39 23zm69-43 44-25v25l-44 25zm60-32 36-21v15l-36 22z" fill="#3a4033"/>
  <path d="m186 502 29 17v28l-29-17zm89 61 22 12v32l-22-13zm194-2 21-12v34l-21 12z" fill="#1e2420" opacity=".8"/>

  <!-- lawn and path -->
  <path d="m146 399 213-123 228 131-213 123z" fill="#4f5e42"/>
  <path d="m168 405 199-115 199 114-199 115z" fill="#596a48"/>
  <path d="m251 441 57-33 135 78-57 33z" fill="#6e6952"/>
  <path d="m291 435 17-10 19 11-17 10zm38 22 18-10 19 11-18 10zm37 22 19-11 19 11-19 11z" fill="#837c60"/>

  <!-- rear trees -->
  <use href="#tree" transform="translate(498 292) scale(.9)"/>
  <use href="#tree" transform="translate(553 325) scale(.72)"/>

  <!-- chimney -->
  <path d="m402 147 31-18 28 16v143l-31 18-28-16z" fill="#4a443c"/>
  <path d="m430 163 31-18v143l-31 18z" fill="#37322b"/>
  <path d="m402 147 31-18 28 16-31 18z" fill="#5e574c"/>
  <path d="m397 137 36-21 33 19v15l-36 21-33-19z" fill="#544c41"/>
  <path d="m397 137 36-21 33 19-36 21z" fill="#6a6153"/>
  <path d="m410 137 23-13 20 11-23 13z" fill="#171a16"/>
  <path d="m407 187 23 13 25-14m-48 31 23 13 25-14m-48 31 23 13 25-14" stroke="#6f6554" stroke-opacity=".45" stroke-width="2"/>

