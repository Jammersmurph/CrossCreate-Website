    <path d="m-15-9-9 16-52-30 9-16zM9-15-7-24l41-62 16 9zM15 9l9-16 52 30-9 16zM-9 15l16 9-41 62-16-9z" fill="#d9cfae" stroke="#6b6448" stroke-width="3"/>
    <path d="m-36-20-8 15m-9-25-8 15m87-65 15 9M14-52l15 9m7 63 8-15m9 25 8-15m-87 65-15-9m27-9-15-9" stroke="#8e8663" stroke-width="2"/>
    <circle r="10" fill="#c99b55" stroke="#3d412f" stroke-width="4"/>
    <circle r="3" fill="#f2e3bb"/>
